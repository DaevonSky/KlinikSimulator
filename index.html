<style>

.app{display:grid;grid-template-columns:minmax(250px,1fr) minmax(300px,1.4fr) minmax(260px,1fr);gap:12px;padding:12px;align-items:start}

.pn{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:12px}

.big{font:700 34px "Source Code Pro",monospace}

.scene{border-radius:8px;padding:6px;margin-bottom:10px}.av{width:100%;height:auto;display:block}.br{transform-origin:94px 49px;animation:bt var(--br,4s) ease-in-out infinite}@keyframes bt{50%{transform:scaleY(1.14)}}

.box{animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}#mid>*{animation:fi .2s}#log div:first-child{animation:fl 1.2s}@keyframes fl{from{background:rgba(76,192,188,.35)}}

NAu('Zentralvenenverschluss',[60,120,200],'Notaufnahme: Mann, 66 J., seit 2 Tagen schmerzlose Sehverschlechterung auf dem rechten Auge.',[[84,'165/95',16,98,36.8,15],[84,'165/95',16,98,36.8,15],[86,'165/95',16,98,36.8,15],[76,'145/85',16,98,36.8,15]],{haupt:'Mein rechtes Auge sieht seit 2 Tagen wie durch Nebel.',verl:'Langsam zunehmend, schmerzlos.',vor:'Bluthochdruck, Diabetes.',med:'Ramipril, Metformin.'},{auge:'Visus 0,2, Augeninnendruck normal.',fundus:'Ausgedehnte Netzhautblutungen in allen Quadranten (Sturm-und-Blitz-Bild), Papillenödem.'},{},{opal:'Augenarzt: intravitreale Anti-VEGF-Injektion, Risikofaktoren behandeln.',bz:'Blutzucker 220 mg/dl.'},['opal'],['monitor','bz','ekg'],{},'Schmerzloser Visusverlust mit flächigen Netzhautblutungen: Welche Diagnose?','Zentralvenenverschluss: Anti-VEGF intravitreal, Behandlung von Hypertonie, Diabetes und Gerinnung, Kontrollen wegen Neovaskularisationsglaukom.'),

NAu('Epidemische Keratokonjunktivitis',[100,200,300],'Ambulanz: Mann, 36 J., seit 3 Tagen rotes, tränendes, brennendes Auge, nun auch das andere Auge, Erkältungssymptome, Kollege ebenfalls betroffen.',[[78,'125/78',14,99,37.4,15],[78,'125/78',14,99,37.4,15],[80,'125/78',14,99,37.5,15],[72,'120/75',14,99,36.8,15]],{haupt:'Rote, tränende Augen mit Fremdkörpergefühl.',verl:'Seit 3 Tagen, das zweite Auge seit gestern.',ereig:'Kontakt zu Kollegen mit Bindehautentzündung.',vor:'Keine.'},{auge:'Follikuläre Bindehautinjektion, wässriges Sekret, präaurikuläre Lymphknoten druckschmerzhaft.',spalt:'Subepitheliale Hornhautinfiltrate.'},{},{iso3:'Strenge Händehygiene, eigene Handtücher, Arbeitsausfall.',par:'Beschwerden gelindert.'},['iso3'],['monitor','par'],{augtr:'Kortikoid-Tropfen ohne Augenarzt bei Adenovirus-Keratitis.'},'Hochansteckende rote Augen mit Lymphknoten: Wie verhinderst du die Ausbreitung?','Adenovirus-Keratokonjunktivitis ist hochansteckend: Händehygiene, getrennte Handtücher, symptomatische Therapie, Augenarzt bei Hornhautbeteiligung, keine Kortikoide ohne Kontrolle.'),

NAu('Glaskörperblutung bei diabetischer Retinopathie',[60,120,200],'Notaufnahme: Frau, 49 J., Typ-1-Diabetes, seit heute Morgen plötzlich viele schwarze Punkte und Schleier im linken Auge ohne Schmerzen.',[[78,'135/80',14,99,36.8,15],[78,'135/80',14,99,36.8,15],[80,'135/80',14,99,36.8,15],[72,'130/78',14,99,36.8,15]],{haupt:'Plötzlich schwarze Punkte und ein Schleier im linken Auge.',verl:'Seit heute Morgen.',vor:'Typ-1-Diabetes seit 25 Jahren, schlecht eingestellt.',med:'Insulin.'},{auge:'Visus links Handbewegungen, kein Funduseinblick.',fundus:'Der rote Reflex fehlt, der Glaskörper ist blutig.'},{sonoa:'Glaskörperblutung, Netzhaut anliegend.'},{opal:'Augenarzt: Ultraschall, Laser- oder Vitrektomieplanung, Anti-VEGF.',bz:'Blutzucker 310 mg/dl.'},['opal'],['monitor','bz','sonoa'],{ass:'Plättchenhemmung und Antikoagulation bei Glaskörperblutung: Nachblutungsrisiko.'},'Schleier und schwarze Punkte beim Diabetiker: Welche Diagnose, welche Untersuchung?','Glaskörperblutung bei proliferativer Retinopathie: Ultraschall bei fehlendem Einblick, Netzhautablösung ausschließen, Laserkoagulation, Anti-VEGF, Vitrektomie, Diabetes optimieren.'),

NPs('Akute Suizidalität',[40,80,140],'Notaufnahme: Mann, 42 J., von der Ehefrau gebracht, nach Trennung und Kündigung zunehmend hoffnungslos, spricht von Todeswünschen.',[[92,'130/80',16,99,36.8,15],[92,'130/80',16,99,36.8,15],[94,'130/80',16,99,36.8,15],[80,'122/76',14,99,36.8,15]],{haupt:'Ich sehe keinen Sinn mehr, ich möchte nicht mehr leben.',verl:'Seit 3 Wochen zunehmend, schlecht schlafen.',vor:'Depression, früher eine Therapie.',med:'Keine Einnahme mehr.',ereig:'Trennung und Jobverlust.'},{psy:'Niedergeschlagen, hoffnungslos, Suizidgedanken ohne konkreten Plan, absprachefähig.',neuro:'Keine Auffälligkeiten.'},{tox:'Ethanol 0,0 Promille, keine Substanzen.'},{gespr:'Wertschätzendes Gespräch, Sicherheitsplan, Ressourcen und Kontaktpersonen einbezogen.',unterb:'Eins-zu-eins-Betreuung bis zur Übergabe, Gefahrenquellen entfernt.',opal:'Psychiatrie: stationäre Aufnahme zur Krisenintervention.'},['gespr','unterb','opal'],['monitor','tox','bz'],{},'Hoffnungslosigkeit und Todeswünsche: Was ist die erste Aufgabe, was gehört zur Sicherheit?','Akute Suizidalität: zugewandtes direktes Gespräch (Fragen nach Suizidgedanken erhöht das Risiko nicht), Risikoabschätzung, Schutzmaßnahmen, Kontaktpersonen einbeziehen, psychiatrische Mitbehandlung, Kriseninterventionsdienste.'),

NPs('Katatonie',[30,60,100],'Notaufnahme: Frau, 30 J., seit 3 Tagen stumm, regungslos, trinkt und isst nicht, starrt ins Leere.',[[110,'100/60',16,98,37.4,12],[116,'96/58',18,98,37.6,11],[122,'90/55',20,98,37.9,10],[88,'115/72',14,99,37.0,15]],{haupt:'Fremdanamnese: spricht nicht mehr, bewegt sich kaum.',verl:'Seit 3 Tagen zunehmend.',vor:'Bipolare Störung.',med:'Lithium abgesetzt.',ereig:'Seit einer Woche schlecht geschlafen.'},{psy:'Mutismus, Stupor, Haltungsverharren, Negativismus.',neuro:'Rigidität, keine Herdzeichen.',haut:'Trockene Schleimhäute.'},{ele:'CK 900 U/l, Kalium 3,3 mmol/l.',ctk:'Unauffällig.'},{lora:'Lorazepam-Test: Mimik und Bewegung bessern sich, das spricht für Katatonie.',nacl:'Flüssigkeit ersetzt.'},['lora','nacl'],['monitor','iv','ele','ctk','bz'],{halo:'Antipsychotika bei Katatonie können den Zustand verschlechtern und ein malignes neuroleptisches Syndrom auslösen.'},'Stupor, Mutismus, Haltungsverharren: Welche Medikamentenklasse hilft, welche schadet?','Katatonie: Benzodiazepine (Lorazepam) als erste Wahl, Flüssigkeit und Thromboseprophylaxe, Antipsychotika meiden, bei Nichtansprechen Elektrokonvulsionstherapie.'),

NL('Natürlicher Tod (Herzinfarkt)','Wohnung: Mann, 78 J., von der Ehefrau tot im Bett aufgefunden, bekannte Herzerkrankung, Hausarzt kennt ihn.','Am Morgen leblos im Bett gefunden.',{haut:'Totenflecke am Rücken (nicht wegdrückbar), Totenstarre voll ausgeprägt, keine Verletzungen.',mund:'Keine Verletzungen, keine Würgemale.',hals:'Unauffällig.'},['todesz','leichen','todesb'],{polizei:'Polizei bei eindeutig natürlicher Todesart nicht nötig.'},'Bekannte Herzerkrankung, keine Verletzungen: Welche Todesart?','Natürlicher Tod: nur nach vollständiger Leichenschau (entkleidet, alle Körperregionen) bescheinigen. Sichere Todeszeichen: Totenflecke (ab etwa 20 bis 30 min), Totenstarre (2 bis 4 h), Fäulnis, mit dem Leben nicht vereinbare Verletzungen.'),
NL('Unklare Todesart','Wohnung: Frau, 45 J., tot aufgefunden, keine bekannten Vorerkrankungen, leere Tablettenpackungen auf dem Nachttisch.','Am Nachmittag leblos im Bett aufgefunden.',{haut:'Totenflecke am Rücken, Totenstarre, keine Verletzungen.',mund:'Schaumiger Flüssigkeitsaustritt aus Mund und Nase.',pupil:'Enge Pupillen.'},['todesz','leichen','polizei'],{todesb:'Todesart natürlich bei ungeklärter Todesursache: falsche Todesart.'},'Unklare Todesursache und Medikamentenpackungen: Welche Todesart kreuzt du an?','Ungeklärte oder nicht natürliche Todesart: Todesbescheinigung mit entsprechender Kennzeichnung, Polizei informieren, Fundort unverändert, Obduktion durch die Staatsanwaltschaft möglich.'),
NL('Verdacht auf Tötungsdelikt','Waldweg: Frau, 30 J., tot aufgefunden, Kleidung gerissen, Verletzungen am Kopf und Armen.','Spaziergänger fand sie am Morgen.',{haut:'Zahlreiche Prellmarken, Abwehrverletzungen an den Unterarmen, Totenflecke, Totenstarre.',mund:'Blut an Mund und Nase.',hals:'Unterblutungen am Hals.'},['polizei','todesz','leichen'],{todesb:'Todesbescheinigung natürlich: falsche Todesart.'},'Verletzungen und Abwehrspuren: Was tust du vor allem, was veränderst du nicht?','Verdacht auf Tötungsdelikt: Fundort und Leichnam nicht verändern, Polizei und Rechtsmedizin sofort, nur Lebenszeichen prüfen, Spuren nicht kontaminieren, Obduktion.'),

NL('Tod durch Erhängen','Garage: Mann, 40 J., von Angehörigen tot aufgefunden, Strangmarke am Hals.','Tot aufgefunden, vor Eintreffen abgeschnitten.',{haut:'Totenflecke an den Unterschenkeln, Strangmarke am Hals, aufsteigend.',mund:'Petechien in den Bindehäuten.',hals:'Strangmarke mit Hautvertrocknung.'},['todesz','leichen','polizei'],{todesb:'Todesbescheinigung natürlich: falsche Todesart.'},'Strangmarke am Hals: Welche Todesart, welche Information an die Polizei?','Strangulation und Erhängen: Strangmarkenbefund und Petechien dokumentieren, nicht natürliche Todesart bescheinigen, Polizei informieren, Hinterbliebene begleiten.'),
NL('Kohlenmonoxidtod','Wohnung: Ehepaar tot im Schlafzimmer, hellrote Totenflecke, Gasheizung mit defektem Abzug.','Am Morgen leblos aufgefunden.',{haut:'Hellrote Totenflecke, Totenstarre, keine Verletzungen.',mund:'Unauffällig.',pupil:'Mittelweit.'},['todesz','leichen','polizei'],{todesb:'Todesbescheinigung natürlich: falsche Todesart.'},'Hellrote Totenflecke bei zwei Verstorbenen: Welche Ursache, wen informierst du?','CO-Vergiftung: hellrote Totenflecke, Co-Oxymetrie (COHb), nicht natürliche Todesart, Polizei und Feuerwehr, weitere Personen im Haus prüfen.'),

st(){const q=CASES.map((x,j)=>j).filter(j=>CASES[j].f==$('#cs').value),ci=q[Math.floor(Math.random()*q.length)],c=CASES[ci],d=$("#df").value,tm=$('#md').value=='t';load(()=>{S={ci,c,d:tm?'s':d,k:tm?4:1,mode:tm?'t':'s',t:0,loc:c.room,inv:[],ok:{},done:{},an:{},ex:{},let:{},log:[],pen:0,errs:[],stab:false,tab:"an",reg:"ganz",over:false};
(c.pre||[]).forEach(k=>S.done[k]=1);if(S.d=='s')S.done.monitor=1;
$("#map").innerHTML=mapHTML();$("#hb").style.display=S.d=='s'?'':'none';$("#ov").className="";L("Übergabe: "+c.brief,"h");render();if(S.mode=='t')intro()})},
nw(){init()}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;if(S&&S.over&&a!="nw")return;if(!S&&a!="st"&&a!="nw")return;H[a](b.dataset.v)});
function mapHTML(){return "<rect width='300' height='200' fill='var(--bd)'/><path d='M0 100H300' stroke='var(--ln)' stroke-dasharray='6 6'/>"+[["schock",10,10,120,80],["lab",140,10,70,80],["rad",220,10,70,80],["apo",10,110,120,80],["op",140,110,150,80]].map(([k,x,y,w,h])=>`<g id="r-${k}" data-a="mv" data-v="${k}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" style="fill:${RC[k]}"/><text x="${x+w/2}" y="${y+16}" text-anchor="middle">${RM[k][0]}</text><text x='${x+w/2}' y='${y+44}' text-anchor='middle' style='font-size:22px'>${RI[k]}</text>${S.c.room==k?`<text class="pt" x="${x+w/2}" y="${y+h-14}" text-anchor="middle">✚ Patient</text>`:""}</g>`).join("")+'<circle id="pl" r="7" cx="0" cy="0"/>'}
const list=(o,t)=>`<h2>${t}</h2>`+Object.keys(o).map(k=>`<div class="row"><span>${mk(k)}${o[k][0]} <span class="m">(${o[k][1]} min)</span></span><button class="b" data-a="lb" data-v="${k}">${S.done[k]?"Wiederholen":"Anfordern"}</button></div>`).join("");
function mid(){const c=S.c,l=S.loc;
if(l=="lab")return list(LB,"Labor (Blutentnahme nötig)");
if(l=="rad")return list(IM,"Radiologie und Punktionen");
if(l=="apo")return"<h2>Apotheke</h2>"+Object.keys(DR).map(k=>`<div class="row"><span>${mk(k)}${DR[k][0]}</span><button class="b" data-a="tk" data-v="${k}">${S.inv.includes(k)?"dabei":"Entnehmen"}</button></div>`).join("");
if(l!=c.room)return`<h2>${RM[l][0]}</h2><p class="m">Hier ist kein Patient. Der Patient liegt im ${RM[c.room][0]}.</p>`;
const T=[["an","Anamnese"],["ex","Untersuchung"],["ac","Maßnahmen"],["dr","Medikamente"]];
let h=`<h2>${RM[l][0]}: Patient</h2>`+av()+T.map(([k,n])=>`<button class="b ${S.tab==k?"on":""}" data-a="tab" data-v="${k}">${n}</button>`).join("");
if(S.tab=="an")h+=Object.keys(AN).map(k=>`<div class="row"><span>${AN[k]}</span><button class="b" data-a="an" data-v="${k}">${S.an[k]?"✓ ":""}Fragen</button></div>`).join("");
if(S.tab=="ex"){h+=`<div class="sc"><svg class="body" viewBox="0 0 120 250" style="--sk:${SK[S.ci%5]}" role="group" aria-label="Körperregionen">`+[["kopf","circle",'cx="60" cy="24" r="18"'],["hals","rect",'x="52" y="42" width="16" height="14"'],["thorax","rect",'x="34" y="56" width="52" height="56" rx="8"'],["abd","rect",'x="38" y="112" width="44" height="46" rx="8"'],["extr","rect",'x="12" y="58" width="18" height="100" rx="8"'],["extr","rect",'x="90" y="58" width="18" height="100" rx="8"'],["extr","rect",'x="40" y="160" width="18" height="84" rx="8"'],["extr","rect",'x="62" y="160" width="18" height="84" rx="8"']].map(([r,t,a])=>`<${t} ${a} data-a="rg" data-v="${r}" class="${S.reg==r?"on":""}"/>`).join("")+`</svg><div><button class="b ${S.reg=="ganz"?"on":""}" data-a="rg" data-v="ganz">Ganzkörper</button><p class="m">${RG[S.reg]}</p>`+Object.keys(EX).filter(k=>EX[k][1]==S.reg).map(k=>`<button class="b" data-a="ex" data-v="${k}">${S.ex[k]?"✓ ":""}${EX[k][0]}</button>`).join("")+"</div></div>"}
if(S.tab=="ac")h+=Object.keys(AC).map(k=>`<div class="row"><span>${mk(k)}${AC[k][0]}</span><button class="b" data-a="ac" data-v="${k}">${S.done[k]?"✓ erledigt":"Durchführen"}</button></div>`).join("");
if(S.tab=="dr")h+=S.inv.length?S.inv.map(k=>{const o=[`<option value="1">${DR[k][1]}</option>`,`<option value="0">${DR[k][2]}</option>`];if(k.charCodeAt(0)%2)o.reverse();return`<div class="row"><span>${mk(k)}${DR[k][0]}<br><select id="d_${k}" aria-label="Dosis ${DR[k][0]}">${o.join("")}</select></span><button class="b" data-a="dr" data-v="${k}">Verabreichen</button></div>`}).join(""):'<p class="m">Du hast nichts dabei. Hol Medikamente aus der Apotheke und komm zurück.</p>';
return h}
function mon(v){if(!S.done.monitor)return'<p>Kein Monitor angeschlossen. Unter Maßnahmen anlegen.</p>';
const t=(l,x,u,w)=>`<div class="t ${w?"w":""}"><small>${l}</small><b>${x}</b><small>${u}</small></div>`;
return ecg(v[0])+t("Herzfrequenz",v[0],"/min",v[0]>120||v[0]<50)+t("Blutdruck",v[1],"mmHg",parseInt(v[1])<90)+t("Atemfrequenz",v[2],"/min",v[2]>28||v[2]<10)+t("SpO₂",v[3],"%",v[3]<90)+t("Temperatur",v[4],"°C",v[4]>39)+t("GCS",v[5],"",typeof v[5]=="number"&&v[5]<9)}
function render(){const c=S.c,v=c.vit[stg()];
$("#hd").textContent=`Minute ${S.t} · ${S.mode=='t'?'Trainingsmodus':DN[S.d]} · ${c.f}`;
for(const k in RM)$("#r-"+k).classList.toggle("cur",S.loc==k);
$("#pl").style.transform=`translate(${RM[S.loc][1]}px,${RM[S.loc][2]+14}px)`;
$("#inv").textContent=S.inv.length?S.inv.map(k=>DR[k][0]).join(", "):"nichts";
$("#trk").innerHTML=S.d=="s"?`<h3>cABCDE-Schema</h3><div class="tk">${"cABCDE".split("").map(l=>`<span class="${S.let[l]?"ok":""}">${l}</span>`).join("")}</div>`:"";
$("#mid").innerHTML=mid();$("#mon").innerHTML=mon(v);
$("#log").innerHTML=S.log.map(e=>`<div class="${e.k}"><small>${e.t}′</small>${e.x}</div>`).join("");document.body.classList.toggle('crit',stg()==2);if(S.pop){const p=S.pop;S.pop=null;popup(p)}}
function end(dead,dx){S.over=true;const c=S.c,nd=c.need.map(a=>[a,!!okn(a)]),gd=c.good.filter(a=>S.done[a]||S.ok[a]).length;
let sc=(dx==c.dx?30:0)+45*nd.filter(n=>n[1]).length/nd.length+25*gd/c.good.length-10*S.pen;sc=dead?0:Math.max(0,Math.round(sc));
$("#ov").className="on";$("#ov").innerHTML=`<div class="box"><h2>${dead?"Patient verstorben":"Fall abgeschlossen"}</h2><div class="big">${sc}/100</div>
${dead?`<p class="r">Die Schlüsselmaßnahmen kamen zu spät. Minute ${S.t}.</p>`:`<p>Deine Diagnose: <b>${dx}</b> ${dx==c.dx?'<span class="g">(richtig)</span>':`<span class="r">(richtig wäre: ${c.dx})</span>`}</p>`}
<h3>Schlüsselmaßnahmen</h3>${nd.map(([a,o])=>`<div class="${o?"g":"r"}">${o?"✓":"✗"} ${nm(a)}</div>`).join("")}
<p class="m">Sinnvolle Zusatzmaßnahmen: ${gd} von ${c.good.length}</p>
${S.errs.length?`<h3>Fehler</h3>${S.errs.map(e=>`<div class="r">${e}</div>`).join("")}`:""}
<h3>Lernpunkt</h3><p>${c.learn}</p><button class="b p" data-a="nw">Neuer Fall</button></div>`}
function init(){S=null;$("#hd").textContent="";$("#ov").className="on";$("#ov").innerHTML=`<div class="box"><h2>Klinik-Simulator</h2><p class="m">Untersuche, behandle und entscheide. Der Patient verschlechtert sich, während die Zeit läuft.</p><label for="cs">Fachbereich</label><select id="cs">${[...new Set(CASES.map(c=>c.f))].map(f=>`<option>${f}</option>`).join('')}</select><label for="md">Modus</label><select id="md"><option value="s">Simulationsmodus: ohne Erklärung, Zeitdruck</option><option value="t">Trainingsmodus: Fall wird erklärt, mehr Zeit, Markierungen</option></select><label for="df">Schwierigkeit (Simulation)</label><select id="df"><option value="s">Student: mehr Zeit, Tipps, cABCDE-Hilfe</option><option value="a">Assistenzarzt: normale Zeit</option><option value="f">Facharzt: knappe Zeit, keine Hilfen</option></select><button class="b p" data-a="st">Fall starten</button><p class="m">Lernspiel. Ersetzt keine klinische Leitlinie oder ärztliche Entscheidung.</p></div>`}
init();
</script></body></html>
